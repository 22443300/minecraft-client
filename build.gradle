plugins {
    id 'fabric-loom' version '1.7.4'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url 'https://maven.fabricmc.net/' }
    maven {
        name = 'TerraformersMC'
        url  = 'https://maven.terraformersmc.com/releases'
    }
    maven {
        name = 'Masa'
        url  = 'https://masa.dy.fi/maven'
    }
}

loom {
    mixin {
        defaultRefmapName = 'phantom.refmap.json'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Bundle Gson (included in MC but explicitly bundled for shade safety)
    include implementation('com.google.code.gson:gson:2.10.1')

    // Optional integrations - compileOnly so mod works without them at runtime
    compileOnly 'com.sk89q.worldedit:worldedit-fabric-mc1.21.1:7.3.0'
    modCompileOnly("fi.dy.masa.litematica:litematica-fabric-mc1.21.1:0.21.0") { transitive = false }
    modCompileOnly("fi.dy.masa.malilib:malilib-fabric-mc1.21.1:0.21.0") { transitive = false }
}

processResources {
    inputs.property 'version', project.version
    filteringCharset 'UTF-8'
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.encoding = 'UTF-8'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    withSourcesJar()
}

jar {
    from('LICENSE') {
        rename { "${it}_${project.archives_base_name}" }
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
    repositories {}
}
